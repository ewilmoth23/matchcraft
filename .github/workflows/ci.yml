name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded push should stop burning runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # The install uses constraints.lock, so the cache must key on it.
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/api/constraints.lock
      - run: python -m pip install -c constraints.lock -e '.[dev]'
      - run: ruff check . ../../scripts ../../eval
      - run: ruff format --check . ../../scripts ../../eval
      - run: mypy app
      # A coverage number that is printed and discarded gates nothing.
      - run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=85
      # The evaluation gate is a first-class check: it is the only thing that measures
      # whether the analysis is any good, and the only automated fairness defense.
      - name: Evaluate analysis quality and fairness
        working-directory: .
        run: python eval/run.py --gate

      - name: Verify clean migration
        env:
          MATCHCRAFT_DATABASE_URL: sqlite:///./ci-migration.db
          MATCHCRAFT_DATA_DIR: ./ci-data
          MATCHCRAFT_PROVIDER: disabled
        run: alembic upgrade head
      - name: Verify migration matches models
        env:
          MATCHCRAFT_DATABASE_URL: sqlite:///./ci-migration.db
          MATCHCRAFT_DATA_DIR: ./ci-data
          MATCHCRAFT_PROVIDER: disabled
        run: alembic check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Advisory-only: a new upstream advisory should surface without blocking an
      # unrelated pull request. Review the annotation before merging.
      - name: Audit Python dependencies
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit --requirement apps/api/constraints.lock --strict
      - name: Audit npm dependencies
        continue-on-error: true
        working-directory: apps/web
        run: npm audit --audit-level=high

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/api/constraints.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -c apps/api/constraints.lock -e 'apps/api[dev]'
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e:full-stack
        working-directory: apps/web

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      # Building proves the images compile; starting proves the healthcheck, the
      # migrate-then-serve entrypoint, and the nginx proxy target actually work.
      - name: Start the stack and smoke-test both services
        env:
          MATCHCRAFT_PROVIDER: disabled
        run: |
          docker compose up -d api web
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/v1/health
          curl -fsS -o /dev/null http://127.0.0.1:5173/
      - if: always()
        run: docker compose logs --no-color --tail=100
      - if: always()
        run: docker compose down --volumes
