[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "matchcraft-api"
version = "0.2.0"
description = "Private, evidence-grounded resume-to-role analysis API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.7,<3",
  "pymupdf>=1.25,<2",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy>=2.0,<3",
  "structlog>=24.4,<27",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pre-commit>=4,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-asyncio>=0.25,<1",
  # Used by tests/test_operations.py to assert the compose file's effective container
  # environment. Available transitively via pre-commit, but the tests depend on it
  # directly, so it is declared.
  "pyyaml>=6,<7",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "B008",  # FastAPI dependencies are intentionally constructed in signatures.
  "E501",  # Ruff format does not wrap long strings; readability is handled manually.
  "RUF001",  # Résumé parsing intentionally recognizes typographic dashes and bullets.
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = ["fitz", "docx", "docx.*"]
ignore_missing_imports = true
