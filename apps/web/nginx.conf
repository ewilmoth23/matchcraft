server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Without an explicit resolver nginx resolves an upstream
  # hostname once at startup and caches it forever, so recreating the API container
  # left every request proxying to a dead IP until the web container was also
  # restarted. A variable in proxy_pass is what forces runtime resolution.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'healthy';
  }

  location /api/v1/ {
    set $matchcraft_api http://api:8000;
    proxy_pass $matchcraft_api/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    # A validated model response can legitimately require multiple bounded attempts.
    # Keep the proxy above the API's maximum timeout/retry envelope (300s x 4 attempts).
    proxy_connect_timeout 5s;
    proxy_read_timeout 1250s;
    proxy_send_timeout 1250s;
    # The API enforces the configured limit (hard maximum 50 MB).
    client_max_body_size 50m;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
